# HL7 on Spark Real-Time Mode. All environment settings are variables; see README.md.
# No `mode: development`: it turns off `continuous`, which Real-Time Mode needs.

bundle:
  name: hl7_realtime

include:
  - resources/**/*.yml

# Pipelines only need src/; parked examples, Terraform, and the local Java subscriber stay local.
sync:
  exclude:
    - examples/**
    - infra/**
    - src/subscriber/**

artifacts:
  hl7rt:
    type: whl
    build: uv build --wheel --out-dir .build
    path: .
    files:
      - source: .build/hl7rt-*.whl

variables:
  # Unity Catalog
  catalog:
    description: Existing catalog for all tables.
  schema:
    description: Schema for all tables (created by the bundle).
    default: hl7_realtime

  warehouse_id:
    description: SQL warehouse for the dashboard (look it up by name per target).

  # Event Hubs (Kafka endpoint)
  eh_namespace:
    description: Event Hubs namespace name (terraform output `eh_namespace`). Bootstrap is <namespace>.servicebus.windows.net:9093.
  eh_service_credential:
    description: Unity Catalog service credential for Event Hubs (Entra ID via the access connector; `make uc` creates it).
    default: ${var.catalog}_eventhubs

  # Topics
  # Topic = the Delta table it lands in: <catalog>.<schema>.<table>
  epic_json_topic:
    description: Topic carrying the existing Epic JSON feed (pre-parsed by the outside system).
    default: ${var.catalog}.${var.schema}.epic_near_realtime_json_from_eventhub
  hl7_raw_topic:
    description: Raw HL7 v2 messages from the source system (one message per record).
    default: ${var.catalog}.${var.schema}.raw_hl7
  hl7_bronze_topic:
    description: Bronze, the raw message plus MSH envelope and raw-topic lineage.
    default: ${var.catalog}.${var.schema}.bronze_hl7
  hl7_silver_topic:
    description: Silver, the parsed message (Epic silver contract + observations).
    default: ${var.catalog}.${var.schema}.silver_hl7
  hl7_quarantine_topic:
    description: Messages that could not be silvered, with the reason.
    default: ${var.catalog}.${var.schema}.quarantine_hl7
  hl7_gold_encounters_topic:
    description: Gold, one record per ADT event (admission, discharge, registration, update).
    default: ${var.catalog}.${var.schema}.gold_encounters
  hl7_gold_observations_topic:
    description: Gold, one record per OBX result (numeric value parsed).
    default: ${var.catalog}.${var.schema}.gold_observations
  hl7_gold_orders_topic:
    description: Gold, one record per ORM order.
    default: ${var.catalog}.${var.schema}.gold_orders

  # Real-Time Mode (hot path)
  rtm_trigger_interval:
    description: RTM checkpoint interval (pipelines.trigger.interval). Each boundary pauses a hop ~2 s on Azure; see docs/latency.md.
    default: 15 minutes
  rtm_max_partitions:
    description: Kafka reader tasks per RTM flow (maxPartitions). Fixed on the GA channel; match the hub partition count.
    default: "4"
  # Kafka source behavior
  kafka_starting_offsets:
    description: Where a new checkpoint starts reading (latest | earliest).
    default: latest
  kafka_max_offsets_per_trigger:
    description: Micro-batch cap for the Epic JSON (non-RTM) pipeline.
    default: "50000"

  # Subscription hub (Lakebase registry; infra/registry.py creates it)
  registry_project:
    description: Lakebase project holding the subscription registry.
    default: hl7-subscriptions
  registry_endpoint:
    description: Lakebase endpoint the hub connects to.
    default: projects/${var.registry_project}/branches/production/endpoints/primary
  registry_database:
    description: Postgres database with the registry schemas.
    default: databricks_postgres
  registry_catalog:
    description: The registry database in Unity Catalog (registered by make registry), read by the subscriptions dashboard.
    default: ${var.catalog}_registry

  # Generators
  generator_rate:
    description: Events per second from the synthetic generators.
    default: "200"

targets:
  # Azure Databricks workspace from infra/azure. The Makefile sets the host (DATABRICKS_HOST), `catalog`, and
  # `eh_namespace` from Terraform outputs, so a weekly rebuild needs no edits here.
  dev:
    default: true
    variables:
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse

