# Continuous synthetic raw HL7 v2 feed into the raw_hl7 topic. Start/stop with `make generate <env>` / `make generate-stop <env>`.
resources:
  jobs:
    hl7_generator:
      name: hl7rt-${bundle.target}-hl7-generator
      max_concurrent_runs: 1
      tasks:
        - task_key: generate
          environment_key: generator
          python_wheel_task:
            package_name: hl7rt
            entry_point: hl7-generator
            parameters:
              - --namespace=${var.eh_namespace}
              - --service-credential=${var.eh_service_credential}
              - --topic=${var.hl7_raw_topic}
              - --rate=${var.generator_rate}
      environments:
        - environment_key: generator
          spec:
            environment_version: "3"
            dependencies:
              - ../../.build/*.whl
              - confluent-kafka>=2.6
