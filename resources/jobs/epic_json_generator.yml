# Continuous synthetic Epic JSON feed. Started by `make demo <env>`, stopped by `make stop <env>`.
resources:
  jobs:
    epic_json_generator:
      name: hl7rt-${bundle.target}-epic-json-generator
      max_concurrent_runs: 1
      tasks:
        - task_key: generate
          environment_key: generator
          python_wheel_task:
            package_name: hl7rt
            entry_point: epic-json-generator
            parameters:
              - --namespace=${var.eh_namespace}
              - --service-credential=${var.eh_service_credential}
              - --topic=${var.epic_json_topic}
              - --rate=${var.generator_rate}
      environments:
        - environment_key: generator
          spec:
            environment_version: "3"
            dependencies:
              - ../../.build/*.whl
              - confluent-kafka>=2.6
