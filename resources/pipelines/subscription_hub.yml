# edp_shared's deferred hub: every app's deferred-tier subscriptions (work that can wait, e.g. billing), whichever hub
# runs its realtime rules, so that load never shares a batch with clinical rules. The realtime hub is
# hub/resources/subscription_hub.yml (the main bundle includes it as edp_shared; a team deploys it as its own hub).
# This is that definition on a longer trigger; only the name, tier, and trigger differ (tests/test_config_wiring.py).
x-hub: &hub
  catalog: ${var.catalog}
  schema: ${var.hub_schema}
  serverless: true
  continuous: true
  channel: PREVIEW
  root_path: ../../src
  libraries:
    - glob:
        include: ../../src/pipelines/subscription_hub/**
  environment:
    dependencies:
      - pg8000>=1.31           # pure Python; psycopg[binary] aborted the serverless Python process
      - databricks-sdk>=0.159  # Lakebase endpoint + database credential APIs
      - sqlglot>=30.27         # the hub re-checks each SQL rule (src/subscription_api/rules.py)
      - confluent-kafka>=2.6   # a producer per app on the driver, so one app's broken hub can't stall another's
x-hub-conf: &hub_conf
  hl7.subscriptions.hub: ${var.subscription_hub}
  hl7.subscriptions.on_failure: ${var.hub_on_failure}
  hl7.subscriptions.chunk: ${var.hub_rules_per_projection}
  hl7.subscriptions.max_records_per_batch: ${var.hub_max_records_per_batch}
  hl7.eh.namespace: ${var.eh_namespace}
  hl7.eh.service_credential: ${var.hub_service_credential}
  hl7.registry.endpoint: ${var.registry_endpoint}
  hl7.registry.database: ${var.registry_database}
  hl7.registry.connections: ${var.hub_registry_connections}
  hl7.topics.silver_encounters: ${var.hl7_silver_encounters_topic}
  hl7.topics.silver_observations: ${var.hl7_silver_observations_topic}
  hl7.topics.silver_orders: ${var.hl7_silver_orders_topic}
  hl7.topics.silver_diagnoses: ${var.hl7_silver_diagnoses_topic}
  hl7.topics.silver_documents: ${var.hl7_silver_documents_topic}
  # Delta tables instead of the silver topics (empty: the topics), and each row's coordinates (SQL expressions)
  hl7.subscriptions.tables: ${var.subscription_tables}
  hl7.subscriptions.table_partition: ${var.subscription_table_partition}
  hl7.subscriptions.table_offset: ${var.subscription_table_offset}
  hl7.subscriptions.table_ts: ${var.subscription_table_ts}
  hl7.subscriptions.table_max_files: ${var.subscription_table_max_files}

resources:
  pipelines:
    subscription_hub_deferred:
      <<: *hub
      name: hl7rt-${bundle.target}-hub-${var.subscription_hub}-deferred
      configuration:
        <<: *hub_conf
        hl7.subscriptions.tier: deferred
        pipelines.trigger.interval: ${var.hub_deferred_interval_seconds} seconds
