# Hot path, silver — Real-Time Mode (serverless, GA): bronze_hl7 -> silver_{messages,encounters,observations,orders,diagnoses}
# | quarantine_hl7 topics: one flow parses each message once and routes each entity row by its topic.
resources:
  pipelines:
    hl7_silver:
      name: hl7rt-${bundle.target}-hl7-silver
      catalog: ${var.catalog}
      schema: ${resources.schemas.hl7.name}
      serverless: true
      continuous: true
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/pipelines/hl7_silver/**
      configuration:
        spark.databricks.streaming.realTimeMode.enabled: "true"
        hl7.rtm.trigger_interval: ${var.rtm_trigger_interval}
        hl7.rtm.max_partitions: ${var.rtm_max_partitions}
        hl7.eh.namespace: ${var.eh_namespace}
        hl7.eh.service_credential: ${var.eh_service_credential}
        hl7.kafka.starting_offsets: ${var.kafka_starting_offsets}
        hl7.topics.bronze: ${var.hl7_bronze_topic}
        hl7.topics.silver_messages: ${var.hl7_silver_messages_topic}
        hl7.topics.silver_encounters: ${var.hl7_silver_encounters_topic}
        hl7.topics.silver_observations: ${var.hl7_silver_observations_topic}
        hl7.topics.silver_orders: ${var.hl7_silver_orders_topic}
        hl7.topics.silver_diagnoses: ${var.hl7_silver_diagnoses_topic}
        hl7.topics.quarantine: ${var.hl7_quarantine_topic}
