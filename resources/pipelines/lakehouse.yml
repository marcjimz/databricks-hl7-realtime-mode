# Near-real-time path — every hot-path topic -> Delta streaming tables + latency telemetry.
# Micro-batch (NOT Real-Time Mode): RTM can't write Delta, so the mirror is its own pipeline.
resources:
  pipelines:
    lakehouse:
      name: hl7rt-${bundle.target}-lakehouse
      catalog: ${var.catalog}
      schema: ${resources.schemas.hl7.name}
      serverless: true
      continuous: true
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/pipelines/lakehouse/**
      configuration:
        hl7.eh.namespace: ${var.eh_namespace}
        hl7.eh.secret_scope: ${var.eh_secret_scope}
        hl7.eh.secret_key: ${var.eh_secret_key}
        hl7.kafka.starting_offsets: ${var.kafka_starting_offsets}
        hl7.kafka.max_offsets_per_trigger: ${var.kafka_max_offsets_per_trigger}
        hl7.topics.raw: ${var.hl7_raw_topic}
        hl7.topics.bronze: ${var.hl7_bronze_topic}
        hl7.topics.silver: ${var.hl7_silver_topic}
        hl7.topics.quarantine: ${var.hl7_quarantine_topic}
        hl7.topics.gold_encounters: ${var.hl7_gold_encounters_topic}
        hl7.topics.gold_observations: ${var.hl7_gold_observations_topic}
        hl7.topics.gold_orders: ${var.hl7_gold_orders_topic}
