[project]
name = "hl7rt"
version = "0.1.0"
description = "HL7 v2 on Spark Real-Time Mode: raw -> bronze -> silver -> gold over Azure Event Hubs."
requires-python = ">=3.12"

[project.optional-dependencies]
generators = ["confluent-kafka>=2.6"]

[project.scripts]
epic-json-generator = "hl7rt.generators.epic_json:main"
hl7-generator = "hl7rt.generators.hl7v2:main"

[dependency-groups]
dev = [
  "pyspark[connect]~=4.1.0",
  "pytest>=8.3",
  "ruff>=0.8",
  "pre-commit>=4.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl7rt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples"]  # parked, not linted (examples/subscriptions/README.md)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# `spark` / `dbutils` are injected globals in pipeline source files.
per-file-ignores = { "src/pipelines/**" = ["F821"] }
